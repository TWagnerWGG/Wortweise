</style></head><body><div class="app"><header><a class="brand" href="#"><span class="mark">w.</span> wortweise<span class="dot">●</span></a><span class="tag">DEIN LATEINTRAINER</span></header><main id="main"><section class="panel"><h1>Wortweise</h1><p>Diese Ansicht führt kein JavaScript aus. Öffne die Datei in einem Browser oder einer HTML-App mit JavaScript-Unterstützung. Die Vorschau der iPhone-Dateien-App reicht für den Vokabeltrainer nicht aus.</p></section></main><nav aria-label="Hauptnavigation"><button data-nav="learn">◈ <span>Lernen</span></button><button data-nav="words">▤ <span>Vokabeln</span></button><button data-nav="settings">⚙ <span>Einstellungen</span></button></nav></div><dialog id="dialog"></dialog><div id="toast" role="status"></div><script id="embedded-data" type="application/json">null</script><script>const KEY='wortweise-v1';
const empty=()=>({version:1,chapters:[],words:[],selected:[],source:'Latein',target:'Deutsch',reviews:0});
let data=empty(),storageError=false;
try{const embedded=JSON.parse(document.getElementById('embedded-data').textContent);if(embedded)data=validate(embedded);}catch(e){storageError=true;}
try{const raw=localStorage.getItem(KEY);if(raw){const cached=validate(JSON.parse(raw));if((cached.savedAt||0)>(data.savedAt||0))data=cached;}}catch(e){storageError=true;}
if(!data.words.length && data.source==='Deutsch' && data.target==='Englisch'){data.source='Latein';data.target='Deutsch';}
let view='learn',filter='all',query='',session=null;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.() || ('w-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
function validate(d){if(!d||d.version!==1||!Array.isArray(d.chapters)||!Array.isArray(d.words)||typeof d.source!=='string'||typeof d.target!=='string')throw Error('Ungültige Sicherung');const ids=new Set();for(const c of d.chapters){if(typeof c.id!=='string'||typeof c.name!=='string'||!c.name.trim()||ids.has(c.id))throw Error('Ungültige Kapitel');ids.add(c.id);}const ws=new Set();for(const w of d.words){if(typeof w.id!=='string'||ws.has(w.id)||!ids.has(w.chapter)||typeof w.front!=='string'||!w.front.trim()||typeof w.back!=='string'||!w.back.trim()||!Number.isFinite(w.level)||w.level<0||w.level>5||!Number.isFinite(w.due))throw Error('Ungültige Vokabeln');ws.add(w.id);}d.selected=Array.isArray(d.selected)?d.selected.filter(id=>ids.has(id)):[];d.reviews=Number.isFinite(d.reviews)?d.reviews:0;return d;}
function save(){data.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(data));storageError=false;}catch{storageError=true;toast('Speichern nicht möglich. Bitte eine Sicherung exportieren.');}}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500);}
const selectedWords=()=>data.words.filter(w=>data.selected.includes(w.chapter));
const dueWords=()=>selectedWords().filter(w=>w.due<=Date.now());
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));if(view==='learn')renderLearn();else if(view==='words')renderWords();else renderSettings();if(storageError)$('#main').insertAdjacentHTML('afterbegin','<p class="error" role="alert">Lokale Daten konnten nicht gelesen oder gespeichert werden. Vor weiteren Änderungen bitte eine Sicherung exportieren.</p>');}
function renderLearn(){if(session){renderSession();return;}const total=selectedWords().length,due=dueWords().length;$('#main').innerHTML=`<div class="intro"><button class="primary full" id="load-vocab">Vokabeldatei importieren</button><p class="hint">Die Datei wird nur auf diesem Gerät eingelesen, nicht auf die Website hochgeladen.</p><div class="eyebrow">KLEINE SCHRITTE. GROSSE FORTSCHRITTE.</div><h1>Ein Wort weiter.</h1><p>Deine Kapitel. Dein Tempo. Jeden Tag ein bisschen mehr.</p><div class="stats"><div class="stat"><strong>${data.words.length}</strong><span>Vokabeln insgesamt</span></div><div class="stat"><strong>${due}</strong><span>Jetzt lernbereit</span></div><div class="stat"><strong>${data.words.filter(w=>w.level>=3).length}</strong><span>Gut gefestigt</span></div></div></div><div class="layout"><section class="panel chapter-panel"><div class="section-head"><h2>Deine Kapitel</h2><button class="small ghost" id="newchapter">+ Kapitel</button></div>${data.chapters.length?`<div class="row"><span class="hint">Mehrere Kapitel kombinierbar</span><button class="small" id="all">${data.selected.length===data.chapters.length?'Keine':'Alle'} auswählen</button></div><div class="chapter-grid">${data.chapters.map(c=>`<label class="chapter"><input type="checkbox" data-chapter="${esc(c.id)}" ${data.selected.includes(c.id)?'checked':''}><span class="name"><b>${esc(c.name)}</b><small>${data.words.filter(w=>w.chapter===c.id).length} Vokabeln</small></span></label>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">▤</div><h2>Platz für deine Wörter</h2><p>Importiere deine Vokabeldatei über die Schaltfläche oben oder lege eigene Kapitel an.</p><button class="ghost" id="firstchapter">Erstes Kapitel anlegen</button></div>`}</section><section class="panel study-panel"><div><div class="eyebrow">DEINE NÄCHSTE LERNRUNDE</div><h2 class="spacer">Was bleibt,<br>wird wiederholt.</h2><p>${total?`${total} Vokabeln aus ${data.selected.length} ausgewählten Kapiteln. ${due} davon sind jetzt fällig.`:'Wähle Kapitel mit Vokabeln aus, um deine Lernrunde zu starten.'}</p></div><div><button class="primary full" id="start" ${due?'':'disabled'}>Lernrunde starten <span aria-hidden="true">↗</span></button>${total&&!due?'<button class="ghost full spacer" style="color:white" id="practice">Trotzdem alle üben</button>':''}</div></section></div><p class="hint spacer note">Lateinischer Begriff → vier deutsche Antworten. Falsch beantwortete Wörter kommen erneut. Sichere Wörter werden nach längeren Abständen wiederholt.</p>`;$('#load-vocab').onclick=importVocabulary;$('#newchapter').onclick=()=>chapterDialog();if($('#firstchapter'))$('#firstchapter').onclick=chapterDialog;if($('#all'))$('#all').onclick=()=>{data.selected=data.selected.length===data.chapters.length?[]:data.chapters.map(c=>c.id);save();render();};document.querySelectorAll('[data-chapter]').forEach(el=>el.onchange=()=>{data.selected=el.checked?[...data.selected,el.dataset.chapter]:data.selected.filter(x=>x!==el.dataset.chapter);save();render();});$('#start').onclick=()=>startSession(false);if($('#practice'))$('#practice').onclick=()=>startSession(true);}
function chapterOptions(selected){return data.chapters.map(c=>`<option value="${esc(c.id)}" ${selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('');}
function openDialog(html,fn){const d=$('#dialog');d.innerHTML=html;d.showModal();d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());if(fn)fn(d);}
function chapterDialog(id){const c=data.chapters.find(c=>c.id===id);openDialog(`<form><h2>${c?'Kapitel umbenennen':'Neues Kapitel'}</h2><label for="chaptername">Kapitelname</label><input id="chaptername" maxlength="100" required placeholder="z. B. Lektion 1" value="${esc(c?.name||'')}"><div class="actions"><button type="button" class="ghost" data-close>Abbrechen</button><button class="primary">Speichern</button></div></form>`,d=>d.querySelector('form').onsubmit=e=>{e.preventDefault();const name=$('#chaptername').value.trim();if(!name)return;if(c)c.name=name;else{const id=uid();data.chapters.push({id,name});data.selected.push(id);filter=id;}save();d.close();render();});}
function renderWords(){const list=data.words.filter(w=>(filter==='all'||w.chapter===filter)&&(`${w.front} ${w.back}`).toLocaleLowerCase().includes(query.toLocaleLowerCase()));$('#main').innerHTML=`<div class="eyebrow">DEINE SAMMLUNG</div><h1>Wörter mit Zukunft.</h1><p>Ordne deine Vokabeln nach Kapiteln.</p><div class="toolbar"><button class="primary" id="addword" ${data.chapters.length?'':'disabled'}>+ Vokabel</button><button class="ghost" id="newchapter">+ Kapitel</button><button class="ghost" id="bulk" ${data.chapters.length?'':'disabled'}>Liste einfügen</button></div><div class="toolbar"><select aria-label="Kapitel filtern" id="filter"><option value="all">Alle Kapitel</option>${chapterOptions(filter)}</select>${filter!=='all'?'<button class="small ghost" id="rename">Umbenennen</button><button class="small ghost danger" id="deletechapter">Kapitel löschen</button>':''}</div><input id="search" type="search" placeholder="Vokabel suchen …" aria-label="Vokabel suchen" value="${esc(query)}"><section class="panel spacer" id="wordlist">${list.length?list.map(w=>`<div class="word"><div class="name"><b>${esc(w.front)}</b><div>${esc(w.back)}</div><small>${esc(data.chapters.find(c=>c.id===w.chapter)?.name)} · ${w.level===0?'Neu / wiederholen':`Lernstufe ${w.level} von 5`}</small></div><button class="ghost" data-edit="${esc(w.id)}">Bearbeiten</button><button class="ghost danger" aria-label="${esc(w.front)} löschen" data-delete="${esc(w.id)}">×</button></div>`).join(''):'<div class="empty"><div class="empty-icon">Aa</div><h2>Noch keine passenden Vokabeln</h2><p>Hier erscheinen deine Wörter, sobald du sie hinzugefügt hast.</p></div>'}</section>`;$('#newchapter').onclick=()=>chapterDialog();$('#addword').onclick=()=>wordDialog();$('#bulk').onclick=bulkDialog;$('#filter').onchange=e=>{filter=e.target.value;renderWords();};$('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;renderWords();$('#search').focus();try{$('#search').setSelectionRange(pos,pos);}catch{}};if($('#rename'))$('#rename').onclick=()=>chapterDialog(filter);if($('#deletechapter'))$('#deletechapter').onclick=()=>{const c=data.chapters.find(c=>c.id===filter);confirmDialog(`„${c.name}“ löschen?`,'Alle Vokabeln und Lernstände dieses Kapitels werden ebenfalls gelöscht.',()=>{data.words=data.words.filter(w=>w.chapter!==filter);data.chapters=data.chapters.filter(c=>c.id!==filter);data.selected=data.selected.filter(id=>id!==filter);filter='all';save();render();});};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>wordDialog(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>confirmDialog('Vokabel löschen?','Diese Vokabel und ihr Lernstand werden entfernt.',()=>{data.words=data.words.filter(w=>w.id!==b.dataset.delete);save();render();}));}
function confirmDialog(title,message,fn){openDialog(`<h2>${esc(title)}</h2><p>${esc(message)}</p><div class="actions"><button class="ghost" data-close>Abbrechen</button><button class="primary" id="confirm">Bestätigen</button></div>`,d=>$('#confirm').onclick=()=>{d.close();fn();});}
function wordDialog(id){const w=data.words.find(w=>w.id===id);openDialog(`<form><h2>${w?'Vokabel bearbeiten':'Neue Vokabel'}</h2><label for="chapter">Kapitel</label><select id="chapter">${chapterOptions(w?.chapter||(filter==='all'?data.chapters[0]?.id:filter))}</select><label for="front">Latein</label><input id="front" required maxlength="500" value="${esc(w?.front||'')}" autocomplete="off"><label for="back">Deutsch</label><input id="back" required maxlength="500" value="${esc(w?.back||'')}" autocomplete="off"><div class="actions"><button type="button" class="ghost" data-close>Abbrechen</button><button class="primary">Speichern</button></div></form>`,d=>d.querySelector('form').onsubmit=e=>{e.preventDefault();const front=$('#front').value.trim(),back=$('#back').value.trim(),chapter=$('#chapter').value;if(!front||!back)return;if(w){if(w.front!==front||w.back!==back){w.level=0;w.due=0;}Object.assign(w,{front,back,chapter});}else data.words.push({id:uid(),front,back,chapter,level:0,due:0});save();d.close();render();});}
function bulkDialog(){openDialog(`<form><h2>Vokabelliste einfügen</h2><p class="hint">Eine Vokabel pro Zeile. Trenne beide Seiten mit einem Semikolon oder Tabulator. Die Reihenfolge ist Latein; Deutsch.</p><label for="chapter">Kapitel</label><select id="chapter">${chapterOptions(filter)}</select><label for="bulktext">Vokabeln</label><textarea id="bulktext" required placeholder="Wort; Übersetzung"></textarea><p id="bulkerror" class="error" role="alert"></p><div class="actions"><button type="button" class="ghost" data-close>Abbrechen</button><button class="primary">Hinzufügen</button></div></form>`,d=>d.querySelector('form').onsubmit=e=>{e.preventDefault();const lines=$('#bulktext').value.split(/\r?\n/).filter(l=>l.trim()),parsed=[];for(let i=0;i<lines.length;i++){const p=lines[i].split(lines[i].includes('\t')?'\t':';');if(p.length!==2||!p[0].trim()||!p[1].trim()){ $('#bulkerror').textContent=`Zeile ${i+1}: Bitte genau zwei ausgefüllte Seiten angeben.`;return;}parsed.push(p.map(s=>s.trim()));}const chapter=$('#chapter').value;let added=0;for(const [front,back] of parsed){if(!data.words.some(w=>w.chapter===chapter&&w.front===front&&w.back===back)){data.words.push({id:uid(),chapter,front,back,level:0,due:0});added++;}}save();d.close();render();toast(`${added} Vokabeln hinzugefügt. Doppelte Einträge übersprungen.`);});}
function shuffled(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function normalized(text){return text.normalize('NFKC').toLocaleLowerCase('de').replace(/[.!?]+$/g,'').replace(/\s+/g,' ').trim();}
function meanings(text){return text.split(/[,;\/\n]|\s+oder\s+/i).map(normalized).filter(Boolean);}
function latinKey(text){return normalized(text).split(/[,;]/)[0].trim();}
function choicesFor(w){
 const same=data.words.filter(x=>latinKey(x.front)===latinKey(w.front));
 const accepted=new Set(same.flatMap(x=>[normalized(x.back),...meanings(x.back)]));
 const seen=new Set([normalized(w.back)]),wrong=[];
 const candidates=shuffled(data.words.filter(x=>data.selected.includes(x.chapter))).concat(shuffled(data.words.filter(x=>!data.selected.includes(x.chapter))));
 for(const x of candidates){const key=normalized(x.back);if(latinKey(x.front)===latinKey(w.front)||seen.has(key)||accepted.has(key)||meanings(x.back).some(m=>accepted.has(m)))continue;seen.add(key);wrong.push(x.back.trim());if(wrong.length===3)break;}
 if(wrong.length<3)return null;
 return shuffled([{text:w.back.trim(),correct:true},...wrong.map(text=>({text,correct:false}))]);
}
function startSession(all){
 const candidates=all?selectedWords():dueWords();if(!candidates.length)return;
 const eligible=candidates.filter(w=>choicesFor(w)!==null);
 if(!eligible.length){openDialog('<h2>Noch nicht genug Antwortmöglichkeiten</h2><p>Für jede Frage werden eine richtige Übersetzung und drei verschiedene falsche Antworten benötigt. Ergänze mindestens vier Vokabeln mit unterschiedlichen Bedeutungen. Bereits bekannte weitere Übersetzungen desselben lateinischen Begriffs werden nicht als falsche Antworten verwendet.</p><div class="actions"><button class="primary" data-close>Verstanden</button></div>');return;}
 const pool=shuffled(eligible).slice(0,20);
 session={queue:pool.map(w=>w.id),total:pool.length,done:0,ratings:0,correct:0,question:null,skipped:candidates.length-eligible.length};renderSession();
}
function renderSession(){
 const s=session;
 if(!s.queue.length){$('#main').innerHTML=`<div class="eyebrow">RUNDE GESCHAFFT</div><h1>Das bleibt hängen.</h1><section class="panel empty spacer"><div class="empty-icon">✓</div><h2>${s.total} Vokabeln geübt</h2><p>${s.correct} von ${s.ratings} Antworten richtig.<br>Dein Lernstand ist gespeichert.</p><button class="primary" id="finish">Zur Kapitelauswahl</button></section>`;$('#finish').onclick=()=>{session=null;render();};return;}
 const w=data.words.find(w=>w.id===s.queue[0]);
 if(!s.question)s.question={options:choicesFor(w),picked:null};
 const q=s.question,answered=q.picked!==null;
 $('#main').innerHTML=`<div class="row"><button class="ghost small" id="exit">← Runde beenden</button><span class="hint">${s.done} von ${s.total} abgeschlossen</span></div><div class="progress"><div style="width:${s.done/s.total*100}%"></div></div><div class="row spacer"><span class="eyebrow">${esc(data.chapters.find(c=>c.id===w.chapter)?.name)}</span><span class="hint">Latein → Deutsch</span></div><section class="panel flash full question"><span class="eyebrow">WAS BEDEUTET …?</span><span class="term">${esc(w.front)}</span><span class="hint">Wähle genau eine deutsche Übersetzung.</span></section><div class="choices" role="group" aria-label="Vier Antwortmöglichkeiten">${q.options.map((o,i)=>`<button class="choice ${answered?(o.correct?'correct':q.picked===i?'incorrect':''):''}" data-choice="${i}" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o.text)}${answered&&o.correct?' ✓':answered&&q.picked===i?' ✕':''}</span></button>`).join('')}</div>${answered?`<div class="feedback ${q.options[q.picked].correct?'success':'error'}" role="status">${q.options[q.picked].correct?'Richtig!':'Noch nicht richtig. Die richtige Übersetzung lautet: '+esc(w.back)+'. Diese Vokabel kommt erneut.'}</div><button class="primary full spacer" id="next">Weiter →</button>`:''}<p class="hint spacer">Bis zu 20 Vokabeln pro Runde. Falsche Antworten werden wiederholt. Die drei Ablenkantworten stammen aus deiner Sammlung.</p>${s.skipped?`<p class="hint">${s.skipped} Vokabel(n) ausgelassen: Dafür fehlen drei geeignete Ablenkantworten.</p>`:''}`;
 $('#exit').onclick=()=>confirmDialog('Lernrunde beenden?','Bereits beantwortete Fragen bleiben gespeichert.',()=>{session=null;render();});
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answerChoice(Number(b.dataset.choice)));
 if($('#next'))$('#next').onclick=nextQuestion;
}
function answerChoice(index){
 const s=session,q=s?.question;if(!q||q.picked!==null||!Number.isInteger(index)||!q.options[index])return;
 q.picked=index;const w=data.words.find(w=>w.id===s.queue[0]);const correct=q.options[index].correct;
 s.ratings++;if(correct){s.correct++;w.level=Math.min(5,w.level+1);w.due=Date.now()+[0,1,3,7,14,30][w.level]*86400000;}else{w.level=0;w.due=Date.now();}
 data.reviews++;save();renderSession();
}
function nextQuestion(){const s=session;if(!s?.question||s.question.picked===null)return;const correct=s.question.options[s.question.picked].correct;const id=s.queue.shift();if(correct)s.done++;else s.queue.splice(Math.min(3,s.queue.length),0,id);s.question=null;renderSession();}
function mergeVocabulary(imported){
 const next=validate(JSON.parse(JSON.stringify(data)));
 let added=0;
 for(const chapter of imported.chapters){
  let target=next.chapters.find(c=>c.id===chapter.id||c.name.trim()===chapter.name.trim());
  if(!target){target={id:uid(),name:chapter.name};next.chapters.push(target);}
  for(const w of imported.words.filter(w=>w.chapter===chapter.id)){
   if(!next.words.some(x=>x.chapter===target.id&&x.front===w.front&&x.back===w.back)){
    next.words.push({id:uid(),chapter:target.id,front:w.front,back:w.back,level:0,due:0});added++;
   }
  }
 }
 if(!next.selected.length&&next.chapters.length)next.selected=[next.chapters[0].id];
 data=validate(next);return added;
}
function importVocabulary(){
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.hidden=true;document.body.appendChild(input);
 input.oncancel=()=>input.remove();
 input.onchange=async()=>{const file=input.files[0];if(!file){input.remove();return;}
 try{const imported=validate(JSON.parse(await file.text()));
 confirmDialog('Vokabeln importieren?',`${imported.chapters.length} Kapitel mit ${imported.words.length} Einträgen ergänzen? Vorhandene Vokabeln und Lernstände bleiben erhalten. Doppelte Einträge werden übersprungen.`,()=>{const added=mergeVocabulary(imported);session=null;filter='all';save();render();toast(`${added} Vokabeln hinzugefügt.`);});
 }catch{toast('Bitte eine gültige Wortweise-JSON-Datei auswählen. Es wurde nichts verändert.');}finally{input.remove();}};input.click();
}
function renderSettings(){$('#main').innerHTML=`<div class="eyebrow">SO LERNST DU</div><h1>Ganz nach deinem Wort.</h1><div class="settings-grid"><section class="panel spacer"><h2>Vokabeln importieren</h2><p>Wähle deine JSON-Datei aus der Dateien-App. Neue Kapitel und Wörter werden ergänzt; vorhandene Lernstände bleiben erhalten.</p><button class="primary full" id="load-vocab">Vokabeldatei importieren</button><p class="hint">Der Import erfolgt lokal auf diesem Gerät. Es werden keine Vokabeln an einen Server gesendet.</p></section><section class="panel spacer"><h2>Deine Abfrage</h2><p>Latein → Deutsch: vier Antwortmöglichkeiten, genau eine richtig. Falsche Antworten werden wiederholt.</p></section><section class="panel spacer"><h2>Lernstand sichern</h2><p>Deine Sammlung und dein Lernstand bleiben in diesem Browser gespeichert, sofern der Browserspeicher verfügbar ist. Beim Löschen der Website-Daten können sie verloren gehen. Auf einem anderen Gerät oder unter einer anderen Webadresse musst du sie erneut importieren.</p><div class="toolbar"><button class="primary" id="export">Sicherung exportieren</button><button class="ghost" id="import">Sicherung wiederherstellen</button><input hidden type="file" accept="application/json,.json" id="file"></div><p class="hint">Die Sicherung enthält deine Vokabeln. Bewahre sie privat auf. Beim Wiederherstellen wird die aktuelle Sammlung ersetzt.</p></section><section class="panel spacer"><h2>Auf deinem iPhone</h2><p>Öffne die veröffentlichte App in Safari. Speichere die Vokabeldatei in „Dateien“ und wähle sie hier beim Import aus. Nur die leere HTML-App gehört auf deinen Webspace, die JSON-Datei bleibt privat.</p></section></div>`;
 $('#load-vocab').onclick=importVocabulary;
 $('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='Wortweise-private-Sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);};
 $('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const imported=validate(JSON.parse(await file.text()));confirmDialog('Sicherung wiederherstellen?',`${imported.chapters.length} Kapitel und ${imported.words.length} Vokabeln laden? Deine aktuelle Sammlung und dein Lernstand werden ersetzt.`,()=>{data=imported;filter='all';session=null;save();render();toast('Sicherung geladen');});}catch{toast('Die Datei ist keine gültige Wortweise-Sicherung.');}e.target.value='';};
}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;if(view!=='learn')session=null;render();window.scrollTo(0,0);});render();

</script></body></html>
